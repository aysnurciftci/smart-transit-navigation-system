version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - transit-net

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src/graphics:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - transit-net

networks:
  transit-net:
    driver: bridge
